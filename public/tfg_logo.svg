<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .serif-logo { font-family: 'Times New Roman', Times, serif; font-weight: 900; fill: #ffffff; }
    .sans-logo { font-family: 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .divider { stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; }
  </style>
  
  <!-- Stylized TFG -->
  <g filter="url(#glow)">
    <text x="35" y="115" font-size="115" class="serif-logo" letter-spacing="-2">T</text>
    <text x="95" y="140" font-size="90" class="serif-logo" letter-spacing="-2">F</text>
    <text x="145" y="150" font-size="105" class="serif-logo" letter-spacing="-2">G</text>
    
    <!-- Vertical Divider Line -->
    <line x1="260" y1="35" x2="260" y2="160" class="divider" />
    
    <!-- The First Group -->
    <text x="280" y="75" font-size="34" class="sans-logo" font-weight="400" letter-spacing="0.5">The</text>
    <text x="280" y="115" font-size="40" class="sans-logo" font-weight="800" letter-spacing="1">First</text>
    <text x="280" y="155" font-size="40" class="sans-logo" font-weight="800" letter-spacing="1">Group</text>
  </g>
</svg>